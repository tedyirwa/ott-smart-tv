<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OTT Smart TV</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            OTT+
        </div>

        <nav class="navigation">

            <button class="nav-item" tabindex="0">
                Home
            </button>

            <button class="nav-item">
                Live TV
            </button>

            <button class="nav-item">
                Movies
            </button>

            <button class="nav-item">
                Series
            </button>

        </nav>

    </header>


    <main>

        <section class="hero">

            <div class="hero-content">

                <p class="label">
                    FEATURED
                </p>

                <h1>
                    The Last Journey
                </h1>

                <p class="description">
                    An exciting journey through unknown worlds.
                </p>

                <button class="play-button">
                    PLAY
                </button>

                <p class="player-status"></p>

                <div class="video-container">

                    <video class="video-player" width="800">
                        <source src="media/sample.mp4" type="video/mp4">
                    </video>

                    <div class="progress-container">
                        <div class="progress-bar"></div>
                        <div class="player-time">
                            <span class="current-time">00:00</span>
                            /
                            <span class="duration">00:00</span>
                        </div>
                    </div>

                </div>

            </div>

        </section>


        <section class="content-section">

            <h2>
                Continue Watching
            </h2>

            <div class="content-row">

                <div class="content-card" tabindex="0">
                    <div class="poster">
                        MOVIE 1
                    </div>
                </div>

                <div class="content-card" tabindex="0">
                    <div class="poster">
                        MOVIE 2
                    </div>
                </div>

                <div class="content-card" tabindex="0">
                    <div class="poster">
                        MOVIE 3
                    </div>
                </div>

            </div>

        </section>


        <section class="content-section">

            <h2>
                Popular
            </h2>

            <div class="content-row">

                <div class="content-card" tabindex="0">
                    <div class="poster">
                        MOVIE 4
                    </div>
                </div>

                <div class="content-card" tabindex="0">
                    <div class="poster">
                        MOVIE 5
                    </div>
                </div>

                <div class="content-card" tabindex="0">
                    <div class="poster">
                        MOVIE 6
                    </div>
                </div>

                <div class="content-card" tabindex="0">
                    <div class="poster">
                        MOVIE 7
                    </div>
                </div>

                <div class="content-card" tabindex="0">
                    <div class="poster">
                        MOVIE 8
                    </div>
                </div>

            </div>

        </section>

        <section class="content-section">

            <h2>
                Comedi
            </h2>

            <div class="content-row">

                <div class="content-card" tabindex="0">
                    <div class="poster">
                        MOVIE 9
                    </div>
                </div>

            </div>

        </section>

        <section class="content-section">

            <h2>
                Romantic
            </h2>

            <div class="content-row">

                

            </div>

        </section>

        <section class="content-section">

            <h2>
                Horror
            </h2>

            <div class="content-row">

                <div class="content-card" tabindex="0">
                    <div class="poster">
                        MOVIE 10
                    </div>
                </div>

                <div class="content-card" tabindex="0">
                    <div class="poster">
                        MOVIE 11
                    </div>
                </div>

                <div class="content-card" tabindex="0">
                    <div class="poster">
                        MOVIE 12
                    </div>
                </div>

            </div>

        </section>

        <section class="content-section">

            <h2>
                Action
            </h2>

            <div class="content-row">


            </div>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
