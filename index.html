<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OTT Smart TV</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            OTT+
        </div>

        <nav class="navigation">

            <button class="nav-item" tabindex="0">
                Home
            </button>

            <button class="nav-item">
                Live TV
            </button>

            <button class="nav-item">
                Movies
            </button>

            <button class="nav-item">
                Series
            </button>

        </nav>

    </header>

    <main>

        <!-- Hero / Featured Movie -->
        <section class="hero">

            <div class="hero-content">

                <p class="label">
                    FEATURED
                </p>

                <h1>
                    The Last Journey
                </h1>

                <p class="description">
                    An exciting journey through unknown worlds.
                </p>

                <button class="play-button">
                    PLAY
                </button>

                <p class="player-status"></p>

                <div class="video-container">

                    <video class="video-player" width="800">
                        <source src="media/sample.mp4" type="video/mp4">
                    </video>

                    <div class="progress-container">

                        <div class="progress-bar"></div>

                        <div class="player-time">

                            <span class="current-time">
                                00:00
                            </span>

                            /

                            <span class="duration">
                                00:00
                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </section>

        <!-- Movie Search -->
        <section class="search-section">

            <input class="search-input" id="movie-search-input" type="text" placeholder="Search movies..."
                autocomplete="off">

            <div class="api-loading" id="search-movies-loading">
                Loading...
            </div>

            <div class="api-error" id="search-movies-error">
            </div>

            <div class="content-row" id="search-movies-row">
            </div>

        </section>

        <!-- Popular Movies -->
        <section class="content-section">

            <h2>
                Popular Movies
            </h2>

            <div class="api-loading" id="popular-movies-loading">
                Loading...
            </div>

            <div class="api-error" id="popular-movies-error">
            </div>

            <div class="content-row" id="popular-movies-row">
            </div>

        </section>

        <!-- Top Rated Movies -->
        <section class="content-section">

            <h2>
                Top Rated Movies
            </h2>

            <div class="api-loading" id="top-rated-movies-loading">
                Loading...
            </div>

            <div class="api-error" id="top-rated-movies-error">
            </div>

            <div class="content-row" id="top-rated-movies-row">
            </div>

        </section>

    </main>

    <!-- Configuration must load before app.js -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
